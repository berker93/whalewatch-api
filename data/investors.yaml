# The investor universe: every institution WhaleWatch has a page for.
#
# This file is product, not config. A filer that is not in it gets no page, and
# its holdings are deferred at load time because nothing maps its CIK to a
# filer. Seed it with:   make cli c="seed-investors"
# Validated by tests/test_investors.py; schema in app/ingestion/investors.py.
#
# Fields
#   slug          Public URL segment, /investors/<slug>. NEVER rename one: it
#                 breaks every link to the page, and the seed refuses it anyway
#                 (the new slug would claim CIKs the old one owns). The brand
#                 as people say it, lowercase, legal and generic suffixes
#                 dropped where what is left is still unambiguous.
#   display_name  Page title. Our spelling, not the cover page's.
#   manager_name  The person the page is known by, which is not always who runs
#                 the money today: "Warren Buffett", "Jim Simons". Succession
#                 goes in notes. "Investment team" for committee-run firms with
#                 no single public face.
#   category      value | activist | quant | macro | growth | multi_strategy.
#                 One per filer, deliberately coarse; large diversified filers
#                 get their dominant style.
#   country       ISO 3166-1 alpha-2, where the manager is run from - not
#                 EDGAR's mailing address. Quote "NO" (Norway): YAML reads a
#                 bare NO as false.
#   ciks          Every CIK the institution has filed 13Fs under, oldest first.
#                 Predecessor entities belong here: they are the same
#                 institution's history, and filer_cik exists for exactly this.
#                 THE ORDER MATTERS: when two of a filer's CIKs both filed for
#                 one period (an OVERLAP), only the CIK listed LAST counts. That
#                 is the successor during a reorganisation, which is the usual
#                 case; where the primary filer is not the newest entity, list
#                 the primary last anyway (see rokos).
#   overlap       Optional. "successor" (the default, see above) or "sum": every
#                 CIK counts, for institutions that file several separate books
#                 permanently. Set "sum" only once `audit-overlaps` shows the
#                 books really are separate - summing one book filed twice
#                 doubles the fund.
#   notes         For maintainers, not shown to users. Record anything
#                 ingestion needs to know, and every known OVERLAP with how it
#                 resolves.
#
# Sources: Dataroma's superinvestor index and WhaleWisdom's top filers for the
# selection; every CIK checked against EDGAR's submissions API (data.sec.gov)
# on 2026-09-29 for its entity name and its 13F-HR history.
#
# Deliberately absent: pure index managers (Vanguard, BlackRock, State Street).
# Their 13F is the market, and in aggregate views they would drown every
# decision anyone else made. Market makers (Jane Street, Susquehanna, Citadel
# Securities) likewise: inventory, not conviction.

