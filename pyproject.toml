[project]
name = "whalewatch-api"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.14",
    "asyncpg>=0.30",
    "fastapi>=0.115",
    # Runtime, not dev: the EDGAR client is application code. It was already
    # here as a test dependency for httpx.AsyncClient against the ASGI app.
    "httpx>=0.28",
    # The 13F documents are namespaced and the namespace URI has changed between
    # EDGAR schema versions, so every lookup is a local-name() XPath. stdlib
    # ElementTree implements only a subset of XPath that excludes local-name(),
    # which leaves hardcoding a URI that is known to vary as the alternative.
    "lxml>=5.3",
    "pydantic-settings>=2.7",
    "pydantic[email]>=2.9",
    "redis>=5.2",
    "sqlalchemy[asyncio]>=2.0",
    "structlog>=25.1",
    # 9.0+ for AsyncRetrying.wraps copying per call, which is what makes one
    # shared policy object safe for concurrent EDGAR requests.
    "tenacity>=9.0",
    # The operational interface (app/cli.py). Runtime rather than dev: backfill,
    # recompute and replay are how this thing is operated in production, and a
    # container that cannot run them is a container you cannot fix a quarter from.
    "typer>=0.15",
    "uvicorn[standard]>=0.32",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "ASYNC", "RUF"]
# ASYNC catches blocking calls inside async functions — you will make this
# mistake at least twice during Epic 2.

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["testcontainers.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
# Spelled out rather than left to the default, which pytest-asyncio warns about
# and intends to change. One loop per test is what tests/integration relies on
# being *allowed* to assume: its session-scoped engine is NullPool precisely so
# that a per-test loop never inherits a connection opened on another one.
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
markers = [
    "integration: needs a Docker daemon; starts a throwaway Postgres container.",
]

[dependency-groups]
dev = [
    "httpx>=0.28",
    "lxml-stubs>=0.5",
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    # Scripts a different reply per attempt against one URL, which httpx's own
    # MockTransport cannot do and every retry test needs.
    "respx>=0.22",
    "ruff>=0.16.4",
    "testcontainers[postgres]>=4.15",
]
