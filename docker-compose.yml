# Pinning the project name keeps every container, volume and network prefixed
# with `whalewatch-`, independent of what this directory happens to be called.
# That is what keeps this stack from colliding with the predictor-api stack:
# its volumes are `predictor-api_*`, ours are `whalewatch_*`, and `down -v`
# here can never reach across and delete theirs.
name: whalewatch

# Shared by the four Celery services below: the api's image and bind mount,
# so a worker runs the code in the working tree. Anchors are defined before
# they are used, which is why these sit above `services`.
x-celery: &celery
  build:
    context: .
    target: dev
  restart: unless-stopped
  volumes:
    - .:/src
  env_file: .env
  depends_on:
    db:
      condition: service_healthy
    redis:
      condition: service_healthy

x-celery-healthcheck: &celery-healthcheck
  interval: 30s
  timeout: 15s
  retries: 3
  start_period: 30s

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    # pg_stat_statements has to be loaded at server start; CREATE EXTENSION
    # (migration 0016) only adds the view that reads it. track_io_timing puts
    # read times next to the buffer counts in EXPLAIN (ANALYZE, BUFFERS), which
    # is what tells a cold-cache read from a slow plan. See
    # docs/query-performance.md. Changing either means recreating the container:
    # `docker compose up -d db`.
    command:
      - postgres
      - -c
      - shared_preload_libraries=pg_stat_statements
      - -c
      - pg_stat_statements.track=all
      - -c
      - track_io_timing=on
    # Parallel workers share memory through /dev/shm, which Docker caps at 64 MB.
    # A manual VACUUM of the full dataset vacuums its indexes in parallel and
    # asked for 67 MB: "could not resize shared memory segment ... No space left
    # on device". Parallel hash joins draw on the same space.
    shm_size: 256mb
    environment:
      # Same three variables the app reads out of .env, so the credentials the
      # server is initialised with cannot drift from the ones Settings uses to
      # build its DSN. Defaults here only cover a missing .env.
      POSTGRES_USER: "${POSTGRES_USER:-whalewatch}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-localdev}"
      POSTGRES_DB: "${POSTGRES_DB:-whalewatch}"
    ports:
      # Container side is always 5432; only the host side is negotiable, because
      # predictor-api already publishes its Postgres on host 5432. Set DB_PORT in
      # .env to move ours out of the way. Nothing inside the compose network is
      # affected by this — the api talks to `db:5432` either way.
      - "${DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/10-init.sql:ro
    healthcheck:
      # -h 127.0.0.1 matters. During initdb the entrypoint runs a temporary
      # server that listens on the unix socket only, so a socket-based
      # pg_isready reports healthy while 10-init.sql is still running and
      # whalewatch_test does not exist yet. Forcing TCP means "healthy" cannot
      # be true until the real server is up and the init scripts have finished.
      test:
        - CMD-SHELL
        - pg_isready -h 127.0.0.1 -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # Sessions live here (app/accounts/sessions.py), so a Redis that forgot
    # everything on restart would sign everyone out. The append-only file, on a
    # volume, keeps them across a restart and a recreated container.
    command: redis-server --appendonly yes
    volumes:
      - redisdata:/data
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      target: dev
    restart: unless-stopped
    command: uv run uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      # Source is bind-mounted over the copy baked into the image so --reload
      # sees your edits. /opt/venv lives outside /src precisely so this mount
      # cannot bury the installed dependencies.
      - .:/src
    ports:
      - "${API_PORT:-8000}:8000"
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  # --- Celery (app/jobs/celery_app.py) ----------------------------------------
  # One worker per queue, so a half-hour ingestion never queues a short compute
  # task behind it. Each runs under watchfiles, which restarts it when a .py
  # file changes: the worker's equivalent of the api's --reload. A restart
  # mid-task is a dead worker as far as the broker knows, and the task comes
  # back after the visibility timeout (an hour), so leave a long backfill alone.

  # One task at a time. The EDGAR limiter is per process (app/core/rate_limit.py),
  # and two pool children would each pace themselves to 8/s against one IP.
  worker-ingestion:
    <<: *celery
    command: >-
      uv run watchfiles --filter python
      "celery -A app.jobs.celery_app:celery_app worker -Q ingestion --concurrency 1 --hostname ingestion@%h"
      app
    healthcheck:
      <<: *celery-healthcheck
      test: ["CMD-SHELL", "celery -A app.jobs.celery_app:celery_app inspect ping --destination ingestion@$$HOSTNAME --timeout 5"]

  worker-compute:
    <<: *celery
    command: >-
      uv run watchfiles --filter python
      "celery -A app.jobs.celery_app:celery_app worker -Q compute --concurrency 2 --hostname compute@%h"
      app
    healthcheck:
      <<: *celery-healthcheck
      test: ["CMD-SHELL", "celery -A app.jobs.celery_app:celery_app inspect ping --destination compute@$$HOSTNAME --timeout 5"]

  # Exactly one, ever: two beats send every scheduled task twice. Its schedule
  # state goes to /tmp rather than the bind-mounted /src, where it would land in
  # the working tree; losing it on a restart costs at most one early heartbeat.
  beat:
    <<: *celery
    command: >-
      uv run watchfiles --filter python
      "celery -A app.jobs.celery_app:celery_app beat --schedule /tmp/celerybeat-schedule"
      app

  # Queue inspection: http://localhost:5555. Development only, and published on
  # 127.0.0.1 only, unlike the ports above: Flower can revoke tasks and shut
  # workers down, and has no login.
  flower:
    <<: *celery
    command: uv run celery -A app.jobs.celery_app:celery_app flower --port=5555
    ports:
      - "127.0.0.1:${FLOWER_PORT:-5555}:5555"

volumes:
  pgdata:
  redisdata:
