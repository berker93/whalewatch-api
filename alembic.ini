# Alembic configuration.
#
# The one thing this file deliberately does *not* carry is a database URL.
# `sqlalchemy.url` is set at runtime in alembic/env.py from `Settings`, for the
# same reason nothing else in this codebase reads os.environ: a URL pasted here
# is a second source of truth that drifts from the one the app connects with,
# and a password committed to a tracked file. See alembic/env.py.

[alembic]
script_location = %(here)s/alembic

# Filenames lead with the date, so `ls alembic/versions` is chronological and a
# reviewer can see at a glance how old a pending migration is. The revision id
# stays in the name because that is what `alembic history` and `down_revision`
# refer to — the date orders them for humans, the id chains them for Alembic.
# The %% are escapes: configparser reads this file, so a literal % must double.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s

# Alembic runs env.py with the CWD on sys.path only if told to; without this,
# `from app.core.config import ...` fails when alembic is invoked from anywhere
# but the repo root.
prepend_sys_path = .

path_separator = os

# Cap the slug so a descriptive -m message cannot push a filename past what the
# filesystem and, more to the point, a git diff view will show comfortably.
truncate_slug_length = 40

[post_write_hooks]
# Autogenerate emits code, and code in this repo is ruff's business. Without
# these, every generated migration lands with unsorted imports and 100-column
# violations that you fix by hand before committing. Lint-with-fix first (it
# rewrites imports), then format.
hooks = ruff_lint,ruff_format

ruff_lint.type = module
ruff_lint.module = ruff
ruff_lint.options = check --fix REVISION_SCRIPT_FILENAME

ruff_format.type = module
ruff_format.module = ruff
ruff_format.options = format REVISION_SCRIPT_FILENAME

# Logging. `alembic upgrade` is usually run non-interactively in a deploy, so
# alembic's own INFO lines (which revision is being applied) are the deploy log.
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
